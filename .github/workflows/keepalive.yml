# Wake Streamlit Community Cloud app before the ~12h idle sleep threshold.
# URL: https://lhyjrhmwzxqfpuuwsux7zh.streamlit.app
# Override via repo secret STREAMLIT_APP_URL if you change deployments.
#
# Actions → "Streamlit keepalive" → Run workflow

name: Streamlit keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL || 'https://lhyjrhmwzxqfpuuwsux7zh.streamlit.app' }}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake Streamlit app
        run: python scripts/keepalive.py
